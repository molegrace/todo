<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // SPA redirect for GitHub Pages (project pages).
      // Adjust `segmentCount` if your repo name has more/less path segments.
      var segmentCount = 1;

      var location = window.location;
      var origin = location.protocol + "//" + location.hostname + (location.port ? ":" + location.port : "");
      var basePath = location.pathname.split("/").slice(0, 1 + segmentCount).join("/");
      var spaPath = location.pathname.split("/").slice(1 + segmentCount).join("/").replace(/&/g, "~and~");
      var spaQuery = location.search ? "&" + location.search.slice(1).replace(/&/g, "~and~") : "";

      location.replace(origin + basePath + "/?/" + spaPath + spaQuery + location.hash);
    </script>
  </head>
  <body></body>
</html>
